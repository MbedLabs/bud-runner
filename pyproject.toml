[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bud-runner"
version = "1.0.3"
description = "CLI tool for test execution and Bud Test Management Platform integration"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
authors = [
    {name = "EmbedLabs", email = "dev@embedlabs.net"},
    {name = "Amine El Omari"}
]
maintainers = [
    {name = "EmbedLabs", email = "dev@embedlabs.net"}
]
keywords = [
    "testing",
    "automation",
    "ci-cd",
    "runner",
    "junit",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "requests>=2.28.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
bud-runner = "bud_runner.cli:main"

[project.urls]
Homepage = "https://embedlabs.net"
Documentation = "https://embedlabs.net/docs"
Support = "https://embedlabs.net"

[tool.setuptools.packages.find]
where = ["."]
include = ["bud_runner*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
