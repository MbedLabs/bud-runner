name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: # Added to allow manual triggering without creating a new tag

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Check the lock file
        run: uv lock --check --no-build

      - name: Install the build backend
        run: uv sync --frozen --no-build --no-install-project --only-group build

      - name: Install package with dev deps
        run: uv sync --frozen --no-build --no-build-isolation --no-binary-package bud-runner --extra dev --group build --group ci

      - name: Run pytest
        env:
          PACKAGE_ORG: ${{ vars.PACKAGE_ORG }}
          ORG_MAINTAINER: ${{ secrets.ORG_MAINTAINER }}
        run: .venv/bin/python -m pytest tests/ -v

      - name: BudTestCase suite station_naming
        env:
          PACKAGE_ORG: ${{ vars.PACKAGE_ORG }}
          ORG_MAINTAINER: ${{ secrets.ORG_MAINTAINER }}
          PYTHONPATH: ${{ github.workspace }}
        run: .venv/bin/python -c "from tests.budtests.station_naming import StationNaming; raise SystemExit(0 if StationNaming().run() else 1)"

      - name: BudTestCase suite reporting
        env:
          PACKAGE_ORG: ${{ vars.PACKAGE_ORG }}
          ORG_MAINTAINER: ${{ secrets.ORG_MAINTAINER }}
          PYTHONPATH: ${{ github.workspace }}
        run: .venv/bin/python -c "from tests.budtests.reporting import Reporting; raise SystemExit(0 if Reporting().run() else 1)"

      - name: BudTestCase suite api_client
        env:
          PACKAGE_ORG: ${{ vars.PACKAGE_ORG }}
          ORG_MAINTAINER: ${{ secrets.ORG_MAINTAINER }}
          PYTHONPATH: ${{ github.workspace }}
          BUDTEST_WORK_DIR: ${{ runner.temp }}/budtests
        run: .venv/bin/python -c "from tests.budtests.api_client import ApiClient; raise SystemExit(0 if ApiClient().run() else 1)"

      - name: BudTestCase suite verbose
        env:
          PACKAGE_ORG: ${{ vars.PACKAGE_ORG }}
          ORG_MAINTAINER: ${{ secrets.ORG_MAINTAINER }}
          PYTHONPATH: ${{ github.workspace }}
          BUDTEST_WORK_DIR: ${{ runner.temp }}/budtests
        run: .venv/bin/python -c "from tests.budtests.verbose import Verbose; raise SystemExit(0 if Verbose().run() else 1)"

      - name: BudTestCase suite packaging_metadata
        env:
          PACKAGE_ORG: ${{ vars.PACKAGE_ORG }}
          ORG_MAINTAINER: ${{ secrets.ORG_MAINTAINER }}
          PYTHONPATH: ${{ github.workspace }}
        run: .venv/bin/python -c "from tests.budtests.packaging_metadata import PackagingMetadata; raise SystemExit(0 if PackagingMetadata().run() else 1)"

      - name: BudTestCase suite flatten_results
        env:
          PACKAGE_ORG: ${{ vars.PACKAGE_ORG }}
          ORG_MAINTAINER: ${{ secrets.ORG_MAINTAINER }}
          PYTHONPATH: ${{ github.workspace }}
        run: .venv/bin/python -c "from tests.budtests.flatten_results import FlattenResults; raise SystemExit(0 if FlattenResults().run() else 1)"

      - name: BudTestCase suite executor
        env:
          PACKAGE_ORG: ${{ vars.PACKAGE_ORG }}
          ORG_MAINTAINER: ${{ secrets.ORG_MAINTAINER }}
          PYTHONPATH: ${{ github.workspace }}
        run: .venv/bin/python -c "from tests.budtests.executor import Executor; raise SystemExit(0 if Executor().run() else 1)"

      - name: BudTestCase suite auth
        env:
          PACKAGE_ORG: ${{ vars.PACKAGE_ORG }}
          ORG_MAINTAINER: ${{ secrets.ORG_MAINTAINER }}
          PYTHONPATH: ${{ github.workspace }}
          BUDTEST_WORK_DIR: ${{ runner.temp }}/budtests
        run: .venv/bin/python -c "from tests.budtests.auth import Auth; raise SystemExit(0 if Auth().run() else 1)"

      - name: BudTestCase suite cli_signals
        env:
          PACKAGE_ORG: ${{ vars.PACKAGE_ORG }}
          ORG_MAINTAINER: ${{ secrets.ORG_MAINTAINER }}
          PYTHONPATH: ${{ github.workspace }}
        run: .venv/bin/python -c "from tests.budtests.cli_signals import CliSignals; raise SystemExit(0 if CliSignals().run() else 1)"

      - name: BudTestCase suite claim_run
        env:
          PACKAGE_ORG: ${{ vars.PACKAGE_ORG }}
          ORG_MAINTAINER: ${{ secrets.ORG_MAINTAINER }}
          PYTHONPATH: ${{ github.workspace }}
          BUDTEST_WORK_DIR: ${{ runner.temp }}/budtests
        run: .venv/bin/python -c "from tests.budtests.claim_run import ClaimRun; raise SystemExit(0 if ClaimRun().run() else 1)"

      - name: BudTestCase suite cucumber_importer
        env:
          PACKAGE_ORG: ${{ vars.PACKAGE_ORG }}
          ORG_MAINTAINER: ${{ secrets.ORG_MAINTAINER }}
          PYTHONPATH: ${{ github.workspace }}
          BUDTEST_WORK_DIR: ${{ runner.temp }}/budtests
        run: .venv/bin/python -c "from tests.budtests.cucumber_importer import CucumberImporter; raise SystemExit(0 if CucumberImporter().run() else 1)"

      - name: BudTestCase suite backend_url
        env:
          PACKAGE_ORG: ${{ vars.PACKAGE_ORG }}
          ORG_MAINTAINER: ${{ secrets.ORG_MAINTAINER }}
          PYTHONPATH: ${{ github.workspace }}
          BUDTEST_WORK_DIR: ${{ runner.temp }}/budtests
        run: .venv/bin/python -c "from tests.budtests.backend_url import BackendUrl; raise SystemExit(0 if BackendUrl().run() else 1)"

      - name: BudTestCase suite auth_and_status
        env:
          PACKAGE_ORG: ${{ vars.PACKAGE_ORG }}
          ORG_MAINTAINER: ${{ secrets.ORG_MAINTAINER }}
          PYTHONPATH: ${{ github.workspace }}
          BUDTEST_WORK_DIR: ${{ runner.temp }}/budtests
        run: .venv/bin/python -c "from tests.budtests.auth_and_status import AuthAndStatus; raise SystemExit(0 if AuthAndStatus().run() else 1)"

      - name: BudTestCase suite behave_formatter
        env:
          PACKAGE_ORG: ${{ vars.PACKAGE_ORG }}
          ORG_MAINTAINER: ${{ secrets.ORG_MAINTAINER }}
          PYTHONPATH: ${{ github.workspace }}
          BUDTEST_WORK_DIR: ${{ runner.temp }}/budtests
        run: .venv/bin/python -c "from tests.budtests.behave_formatter import BehaveFormatter; raise SystemExit(0 if BehaveFormatter().run() else 1)"

      - name: BudTestCase suite run_tests_upload
        env:
          PACKAGE_ORG: ${{ vars.PACKAGE_ORG }}
          ORG_MAINTAINER: ${{ secrets.ORG_MAINTAINER }}
          PYTHONPATH: ${{ github.workspace }}
          BUDTEST_WORK_DIR: ${{ runner.temp }}/budtests
        run: .venv/bin/python -c "from tests.budtests.run_tests_upload import RunTestsUpload; raise SystemExit(0 if RunTestsUpload().run() else 1)"

      - name: Run bandit security scan
        run: .venv/bin/bandit -r bud_runner/ -ll

      - name: Run pip-audit
        run: .venv/bin/pip-audit

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Check the lock file
        run: uv lock --check --no-build

      - name: Install build tooling
        run: uv sync --frozen --no-build --no-install-project --only-group build --only-group release

      - name: Build distributions
        run: uv build --no-build-isolation

      - name: Validate distributions (twine check)
        run: .venv/bin/twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bud-runner-dist
          path: dist/*

  publish-private:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') # Allow publish on manual trigger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bud-runner-dist
          path: dist/

      - name: Check the lock file
        run: uv lock --check --no-build

      - name: Install publish tooling
        run: uv sync --frozen --no-build --no-install-project --only-group release

      - name: Publish to private registry
        env:
          TWINE_USERNAME: ${{ secrets.PIP_INDEX_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PIP_INDEX_PASSWORD }}
          TWINE_REPOSITORY_URL: ${{ secrets.PIP_REPOSITORY_URL }}
        run: |
          .venv/bin/twine upload dist/*

  publish-pypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bud-runner
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bud-runner-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
