name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: # Added to allow manual triggering without creating a new tag

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Check the lock file
        run: uv lock --check --no-build

      - name: Install the build backend
        run: uv sync --frozen --no-build --no-install-project --only-group build

      - name: Install package with dev deps
        run: uv sync --frozen --no-build --no-build-isolation --no-binary-package bud-runner --extra dev --group build --group ci

      - name: Run pytest
        env:
          PACKAGE_ORG: ${{ vars.PACKAGE_ORG }}
          ORG_MAINTAINER: ${{ secrets.ORG_MAINTAINER }}
        run: .venv/bin/python -m pytest tests/ -v

      - name: Write the BudTestCase folder runner
        run: |
          echo "BUDTESTCASE_RUNNER=$RUNNER_TEMP/run_budtestcases.py" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/run_budtestcases.py" <<'PY'
          """Run every BudTestCase suite of one test folder in one process and fail when any suite fails."""

          import importlib
          import inspect
          import pathlib
          import sys
          import traceback

          from budtestlibrary.budtestcase import BudTestCase


          def suites_of(name):
              """The BudTestCase classes the module itself defines."""
              module = importlib.import_module(name)
              return [
                  member
                  for _, member in inspect.getmembers(module, inspect.isclass)
                  if member.__module__ == name and issubclass(member, BudTestCase)
              ]


          def main(folder, prefix):
              """Run each suite of the folder, print the failed ones, and return the exit code."""
              failed = []
              ran = []
              for path in sorted(folder.glob(f"{prefix}*.py")):
                  name = ".".join(path.with_suffix("").parts)
                  try:
                      suites = suites_of(name)
                  except Exception:
                      traceback.print_exc()
                      failed.append(f"{name} (import)")
                      continue
                  if len(suites) != 1:
                      failed.append(f"{name} (defines {len(suites)} suites, expected 1)")
                      continue
                  ran.append(f"{name}.{suites[0].__name__}")
                  try:
                      passed = suites[0]().run()
                  except Exception:
                      traceback.print_exc()
                      passed = False
                  if not passed:
                      failed.append(ran[-1])
              print(f"{len(ran)} BudTestCase suite(s) ran in {folder}, {len(failed)} failed")
              for item in failed:
                  print(f"FAILED {item}")
              return 1 if failed or not ran else 0


          if __name__ == "__main__":
              raise SystemExit(main(pathlib.Path(sys.argv[1]), sys.argv[2]))
          PY
      - name: BudTestCase suites in tests/api
        env:
          PACKAGE_ORG: ${{ vars.PACKAGE_ORG }}
          ORG_MAINTAINER: ${{ secrets.ORG_MAINTAINER }}
          PYTHONPATH: ${{ github.workspace }}
          BUDTEST_WORK_DIR: ${{ runner.temp }}/budtests
        run: .venv/bin/python "$BUDTESTCASE_RUNNER" tests/api "[a-z]"

      - name: BudTestCase suites in tests/logic
        env:
          PACKAGE_ORG: ${{ vars.PACKAGE_ORG }}
          ORG_MAINTAINER: ${{ secrets.ORG_MAINTAINER }}
          PYTHONPATH: ${{ github.workspace }}
          BUDTEST_WORK_DIR: ${{ runner.temp }}/budtests
        run: .venv/bin/python "$BUDTESTCASE_RUNNER" tests/logic "[a-z]"

      - name: Run bandit security scan
        run: .venv/bin/bandit -r bud_runner/ -ll

      - name: Run pip-audit
        run: .venv/bin/pip-audit

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Check the lock file
        run: uv lock --check --no-build

      - name: Install build tooling
        run: uv sync --frozen --no-build --no-install-project --only-group build --only-group release

      - name: Build distributions
        run: uv build --no-build-isolation

      - name: Validate distributions (twine check)
        run: .venv/bin/twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bud-runner-dist
          path: dist/*

  publish-private:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') # Allow publish on manual trigger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bud-runner-dist
          path: dist/

      - name: Check the lock file
        run: uv lock --check --no-build

      - name: Install publish tooling
        run: uv sync --frozen --no-build --no-install-project --only-group release

      - name: Publish to private registry
        env:
          TWINE_USERNAME: ${{ secrets.PIP_INDEX_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PIP_INDEX_PASSWORD }}
          TWINE_REPOSITORY_URL: ${{ secrets.PIP_REPOSITORY_URL }}
        run: |
          .venv/bin/twine upload dist/*

  publish-pypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bud-runner
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bud-runner-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
