name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: # Added to allow manual triggering without creating a new tag

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Check the lock file
        run: uv lock --check --no-build

      - name: Install the build backend
        run: uv sync --frozen --no-build --no-install-project --only-group build

      - name: Install package with dev deps
        run: uv sync --frozen --no-build --no-build-isolation --no-binary-package bud-runner --extra dev --group build --group ci

      - name: Run pytest
        env:
          PACKAGE_ORG: ${{ vars.PACKAGE_ORG }}
          ORG_MAINTAINER: ${{ secrets.ORG_MAINTAINER }}
        run: .venv/bin/python -m pytest tests/ -v

      - name: Run bandit security scan
        run: .venv/bin/bandit -r bud_runner/ -ll

      - name: Run pip-audit
        run: .venv/bin/pip-audit

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Check the lock file
        run: uv lock --check --no-build

      - name: Install build tooling
        run: uv sync --frozen --no-build --no-install-project --only-group build --only-group release

      - name: Build distributions
        run: uv build --no-build-isolation

      - name: Validate distributions (twine check)
        run: .venv/bin/twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bud-runner-dist
          path: dist/*

  publish-private:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') # Allow publish on manual trigger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bud-runner-dist
          path: dist/

      - name: Check the lock file
        run: uv lock --check --no-build

      - name: Install publish tooling
        run: uv sync --frozen --no-build --no-install-project --only-group release

      - name: Publish to private registry
        env:
          TWINE_USERNAME: ${{ secrets.PIP_INDEX_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PIP_INDEX_PASSWORD }}
          TWINE_REPOSITORY_URL: ${{ secrets.PIP_REPOSITORY_URL }}
        run: |
          .venv/bin/twine upload dist/*

  publish-pypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bud-runner
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bud-runner-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
